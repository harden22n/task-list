<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>元木のタスク一覧</title>
<meta name="theme-color" content="#2f6f5e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --surface: #ffffff; --fg: #1d2622; --muted: #5f6d67; --line: #d9e0dd;
  --accent: #2f6f5e; --accent-soft: #e2efea; --warn: #8a5a12; --warn-soft: #f6ecd9;
  --new: #3a5a9a; --new-soft: #e3e9f6; --err: #a3322a; --err-soft: #f7e3e1;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131a17; --surface: #1b2420; --fg: #e4ebe8; --muted: #9aaaa3; --line: #2c3833;
    --accent: #7cc4ad; --accent-soft: #22362f; --warn: #e2b469; --warn-soft: #3a2f1d;
    --new: #9db6ea; --new-soft: #232d42; --err: #f0a39b; --err-soft: #3d2422;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header h1 { font-size: 1.4rem; margin: 0; }
header .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; }
button, input, select { font: inherit; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
.status { font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; margin: 0; }
.status.info { color: var(--muted); background: var(--accent-soft); }
.status.warn { color: var(--warn); background: var(--warn-soft); }
.status.err { color: var(--err); background: var(--err-soft); }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.filter { font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#list { display: flex; flex-direction: column; gap: 14px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
section h2 { font-size: 1rem; margin: 0; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); }
section h2 .count { font-size: 0.8rem; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
h3 { font-size: 0.8rem; color: var(--muted); margin: 0; padding: 10px 14px 2px; }
ul { list-style: none; margin: 0; padding: 4px 0 8px; }
li + li { border-top: 1px dashed var(--line); }
label.task { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 9px 14px; align-items: start; cursor: pointer; }
label.task input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.text { min-width: 0; overflow-wrap: anywhere; }
.done .t { text-decoration: line-through; color: var(--muted); }
.note { display: block; color: var(--muted); font-size: 0.82rem; }
.tag { display: inline-block; font-size: 0.7rem; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.tag.memory { background: var(--warn-soft); color: var(--warn); }
.tag.phone { background: var(--new-soft); color: var(--new); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-size: 1rem; margin: 0; }
.row { display: flex; flex-direction: column; gap: 4px; }
.row label { font-size: 0.8rem; color: var(--muted); }
.row input, .row select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.primary { align-self: flex-start; padding: 9px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; font-weight: 700; }
.primary:disabled { opacity: 0.5; cursor: default; }
.msg { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; margin: 0; }
.help { font-size: 0.82rem; color: var(--muted); margin: 0; }
details.done-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.done-box summary { padding: 12px 14px; cursor: pointer; font-weight: 700; }
.empty { color: var(--muted); padding: 10px 14px; margin: 0; font-size: 0.85rem; }
footer { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>元木のタスク一覧</h1>
      <p class="sub" id="sub">Obsidianの「タスク一覧.md」と同期</p>
    </div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" id="reload-btn" type="button">再読み込み</button>
      <button class="icon-btn" id="settings-btn" type="button">設定</button>
    </div>
  </header>

  <p class="status info" id="status" hidden></p>

  <form class="card" id="settings" hidden>
    <h2>設定</h2>
    <p class="help">データを置いているGitHubのリポジトリと、アクセス用の鍵（トークン）を入れてください。この端末の中にだけ保存されます。</p>
    <div class="row"><label for="s-owner">GitHubのユーザー名</label><input id="s-owner" autocomplete="off" autocapitalize="off" spellcheck="false" value="harden22n"></div>
    <div class="row"><label for="s-repo">データのリポジトリ名</label><input id="s-repo" autocomplete="off" autocapitalize="off" spellcheck="false" value="task-data"></div>
    <div class="row"><label for="s-token">アクセス用の鍵（トークン）</label><input id="s-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></div>
    <button class="primary" type="submit">保存して読み込む</button>
    <p class="msg" id="s-msg" aria-live="polite"></p>
  </form>

  <div id="main">
    <div class="summary" role="group" aria-label="表示の切り替え">
      <button class="filter" data-f="all" aria-pressed="true" type="button">すべて <span id="c-all"></span></button>
      <button class="filter" data-f="confirmed" aria-pressed="false" type="button">状況確認済み <span id="c-confirmed"></span></button>
      <button class="filter" data-f="memory" aria-pressed="false" type="button">メモリから・未確認 <span id="c-memory"></span></button>
    </div>
    <div id="list" style="margin-top:14px"></div>

    <form class="card" id="add-form" style="margin-top:16px">
      <h2>タスクを追加</h2>
      <div class="row"><label for="add-text">やること</label><input id="add-text" maxlength="200" placeholder="例：広報さっぽろ11月号を読む" required></div>
      <div class="row"><label for="add-note">メモ（なくてもよい）</label><input id="add-note" maxlength="200"></div>
      <div class="row"><label for="add-area">分野</label><select id="add-area"></select></div>
      <button class="primary" id="add-btn" type="submit">追加する</button>
      <p class="msg" id="add-msg" aria-live="polite"></p>
    </form>

    <details class="done-box" style="margin-top:16px">
      <summary>完了したタスク <span id="c-done"></span></summary>
      <ul id="done-list"></ul>
    </details>
  </div>

  <footer>チェックや追加はすぐに保存されます。Obsidianへは1日3回（7時・12時・19時）PCが同期します。「未確認」はClaudeのメモリ（2026-10-31時点）から拾ったもの、「スマホで追加」はまだObsidianに入っていないものです。</footer>
</div>

<script>
const AREAS = ["Obsidian・動画メモ", "試験勉強（係長職候補者試験・事務Ⅲ）", "アプリ作り", "暮らし・端末", "その他"];
const FILE = "tasks.json";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let data = null;     // { updatedAt, tasks: [] }
let sha = null;
let filter = store.get("filter") || "all";
let busy = false;

function setStatus(text, kind = "info") {
  const s = $("status");
  s.hidden = !text; s.textContent = text || ""; s.className = "status " + kind;
}

// ---- GitHub contents API ----
function cfg() { return { owner: store.get("owner") || "", repo: store.get("repo") || "", token: store.get("token") || "" }; }
function apiUrl(c) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${FILE}`; }
function headers(c) { return { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; }
function b64decode(s) { const bin = atob(s.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); }
function b64encode(str) { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }

function explain(res) {
  if (res.status === 401) return "鍵（トークン）が正しくないか、期限が切れています。設定を開いて入れ直してください。";
  if (res.status === 403) return "この鍵ではデータを読み書きできません。鍵の権限（Contents の Read and write）を確かめてください。";
  if (res.status === 404) return "データが見つかりません。ユーザー名・リポジトリ名と、tasks.json があるかを確かめてください。";
  return "GitHubとの通信に失敗しました（" + res.status + "）。少し待ってから再読み込みしてください。";
}

async function fetchData() {
  const c = cfg();
  const res = await fetch(apiUrl(c) + "?t=" + Date.now(), { headers: headers(c), cache: "no-store" });
  if (!res.ok) throw new Error(explain(res));
  const j = await res.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}

async function putData(next, baseSha, message) {
  const c = cfg();
  const res = await fetch(apiUrl(c), {
    method: "PUT", headers: { ...headers(c), "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: b64encode(JSON.stringify(next, null, 2) + "\n"), sha: baseSha }),
  });
  if (res.status === 409 || res.status === 422) return null; // 他の端末やPCが先に更新した
  if (!res.ok) throw new Error(explain(res));
  const j = await res.json();
  return j.content.sha;
}

// 変更は「最新を読み直して同じ操作を当てる」を最大3回まで繰り返す
async function change(apply, message) {
  busy = true;
  try {
    for (let i = 0; i < 3; i++) {
      const fresh = i === 0 && data ? { data: structuredClone(data), sha } : await fetchData();
      apply(fresh.data);
      fresh.data.updatedAt = new Date().toISOString();
      const newSha = await putData(fresh.data, fresh.sha, message);
      if (newSha) { data = fresh.data; sha = newSha; cache(); render(); setStatus(""); return true; }
    }
    throw new Error("保存が重なりました。再読み込みしてからもう一度試してください。");
  } finally { busy = false; }
}

function cache() { store.set("cache", JSON.stringify(data)); }

async function load(quiet) {
  const c = cfg();
  if (!c.token || !c.owner || !c.repo) { openSettings(true); return; }
  if (!quiet) setStatus("読み込んでいます…");
  try {
    const r = await fetchData();
    data = r.data; sha = r.sha; cache(); render(); setStatus("");
  } catch (e) {
    setStatus((e && e.message) || "読み込めませんでした。", data ? "warn" : "err");
  }
}

// ---- 表示 ----
function taskRow(t) {
  const li = el("li", t.done ? "done" : "");
  const lab = el("label", "task");
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = "cb-" + t.id; cb.checked = !!t.done;
  cb.addEventListener("change", async () => {
    const v = cb.checked; cb.disabled = true;
    try {
      await change(d => { const x = d.tasks.find(y => y.id === t.id); if (x) { x.done = v; x.doneAt = v ? new Date().toISOString() : ""; } },
        (v ? "完了: " : "未完了に戻す: ") + t.text);
    } catch (e) { cb.checked = !v; setStatus(e.message, "err"); }
    finally { cb.disabled = false; }
  });
  const tx = el("span", "text");
  tx.append(el("span", "t", t.text));
  if (t.memory) tx.append(el("span", "tag memory", "未確認"));
  if (t.from === "phone" && !t.synced) tx.append(el("span", "tag phone", "スマホで追加"));
  if (t.note) tx.append(el("span", "note", t.note));
  lab.append(cb, tx); li.append(lab);
  return li;
}

function render() {
  const tasks = (data && data.tasks || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const open = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
  const mem = open.filter(t => t.memory).length;
  $("c-all").textContent = open.length; $("c-memory").textContent = mem;
  $("c-confirmed").textContent = open.length - mem; $("c-done").textContent = "(" + done.length + ")";
  document.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));

  const shown = open.filter(t => filter === "all" || (filter === "memory") === !!t.memory);
  const list = $("list"); list.replaceChildren();
  const areas = [...AREAS, ...new Set(shown.map(t => t.area).filter(a => a && !AREAS.includes(a)))];
  areas.forEach(area => {
    const items = shown.filter(t => (t.area || "その他") === area);
    if (!items.length) return;
    const sec = el("section"); const h2 = el("h2", "", area);
    h2.append(el("span", "count", items.length + "件")); sec.append(h2);
    [...new Set(items.map(t => t.group || ""))].forEach(g => {
      if (g) sec.append(el("h3", "", g));
      const ul = el("ul"); items.filter(t => (t.group || "") === g).forEach(t => ul.append(taskRow(t))); sec.append(ul);
    });
    list.append(sec);
  });
  if (!list.children.length) list.append(el("p", "empty", data ? "この表示に当てはまるタスクはありません。" : "まだ読み込んでいません。"));

  const dl = $("done-list"); dl.replaceChildren();
  done.sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || "")).forEach(t => dl.append(taskRow(t)));
  if (!done.length) dl.append(el("li", "empty", "まだありません。"));
  if (data && data.updatedAt) $("sub").textContent = "最終更新 " + new Date(data.updatedAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ---- 操作 ----
AREAS.forEach(a => { const o = el("option", "", a); o.value = a; $("add-area").append(o); });

document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; store.set("filter", filter); render(); }));

$("add-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = $("add-text").value.trim(); if (!text) return;
  const note = $("add-note").value.trim(), area = $("add-area").value;
  $("add-btn").disabled = true; $("add-msg").textContent = "保存しています…";
  try {
    await change(d => {
      const nums = d.tasks.map(t => parseInt(String(t.id).replace(/\D/g, ""), 10) || 0);
      const n = Math.max(0, ...nums) + 1;
      d.tasks.push({ id: "t" + String(n).padStart(2, "0"), order: Math.max(0, ...d.tasks.map(t => t.order || 0)) + 1,
        area, group: "", text, note, memory: false, done: false, doneAt: "", from: "phone", synced: false, createdAt: new Date().toISOString() });
    }, "追加: " + text);
    $("add-text").value = ""; $("add-note").value = ""; $("add-msg").textContent = "追加しました：" + text;
  } catch (e) { $("add-msg").textContent = e.message; }
  finally { $("add-btn").disabled = false; }
});

function openSettings(first) {
  const c = cfg();
  if (c.owner) $("s-owner").value = c.owner;
  if (c.repo) $("s-repo").value = c.repo;
  $("s-token").value = c.token;
  $("settings").hidden = false;
  if (first) setStatus("最初に設定を入れてください。", "warn");
  $("s-token").focus();
}
$("settings-btn").addEventListener("click", () => { $("settings").hidden ? openSettings(false) : ($("settings").hidden = true); });
$("reload-btn").addEventListener("click", () => load(false));
$("settings").addEventListener("submit", async ev => {
  ev.preventDefault();
  store.set("owner", $("s-owner").value.trim()); store.set("repo", $("s-repo").value.trim()); store.set("token", $("s-token").value.trim());
  $("s-msg").textContent = "確かめています…";
  await load(false);
  if (sha) { $("settings").hidden = true; $("s-msg").textContent = ""; } else { $("s-msg").textContent = $("status").textContent; }
});

// 画面に戻ってきたら最新を読み直す
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !busy && cfg().token) load(true); });

try { const c = store.get("cache"); if (c) data = JSON.parse(c); } catch (e) {}
render();
load(false);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
